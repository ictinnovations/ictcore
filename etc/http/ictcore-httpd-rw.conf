# systemd drop-in for the Apache (httpd) unit on RHEL / Rocky / Alma 8 and 9.
#
# On EL8/EL9 the packaged httpd.service ships with ProtectSystem enabled, which
# mounts /usr read-only inside Apache's own namespace. ICTCore writes to
# /usr/ictcore/data and /usr/ictcore/log, so document upload and conversion fail
# there even though the disk is writable and the Unix permissions are correct.
# This is a systemd mount-namespace restriction, not a file-permission problem.
#
# Install:
#   install -D -m 0644 etc/http/ictcore-httpd-rw.conf \
#     /etc/systemd/system/httpd.service.d/ictcore-rw.conf
#   systemctl daemon-reload && systemctl restart httpd
# Verify:
#   systemctl show httpd -p ReadWritePaths
[Service]
ReadWritePaths=/usr/ictcore/data
ReadWritePaths=/usr/ictcore/log
