Alias /api /usr/ictcore/wwwroot

<Directory /usr/ictcore/wwwroot>
    # open_basedir has to be set differently depending on how PHP is wired in.
    # mod_php understands php_admin_value. mod_proxy_fcgi does not, and Apache
    # refuses to start with "Invalid command 'php_admin_value'", which is what
    # happens on EL8 and EL9 where PHP runs under php-fpm.
    <IfModule mod_proxy_fcgi.c>
        SetEnv PHP_ADMIN_VALUE "open_basedir=/usr/ictcore/:/usr/bin:/bin:/tmp/"
    </IfModule>
    <IfModule mod_php.c>
        php_admin_value open_basedir "/usr/ictcore/:/usr/bin:/bin:/tmp/"
    </IfModule>
    <IfModule mod_php7.c>
        php_admin_value open_basedir "/usr/ictcore/:/usr/bin:/bin:/tmp/"
    </IfModule>
    <IfModule mod_php5.c>
        php_admin_value open_basedir "/usr/ictcore/:/usr/bin:/bin:/tmp/"
    </IfModule>

    Options Indexes FollowSymLinks Includes
    AllowOverride All
    <IfVersion < 2.4>
        Allow from all
    </IfVersion>
    <IfVersion >= 2.4>
        Require all granted
    </IfVersion>
</Directory>
